name: Discovery task
description: Scope an independent hypothesis, check, or integration task.
title: "[Discovery] "
body:
  - type: textarea
    id: question
    attributes:
      label: Question and useful outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Task ID, owned paths, and dependencies
      description: Task ownership requires the live claim ref protocol.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Assumptions, target exposure, fits, and baseline
  - type: textarea
    id: discriminant
    attributes:
      label: Next discriminating calculation or measurement
